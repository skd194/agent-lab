services:
  postgres:
    image: postgres:16-alpine
    container_name: aoen-postgres
    environment:
      POSTGRES_USER: aoen
      POSTGRES_PASSWORD: aoen
      POSTGRES_DB: aoen
    ports:
      - "5432:5432"
    volumes:
      - aoen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoen"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aoen-redis
    ports:
      - "6379:6379"
    volumes:
      - aoen_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aoen_pgdata:
  aoen_redisdata:
