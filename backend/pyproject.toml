[project]
name = "aoen-backend"
version = "0.1.0"
description = "AOEN — Personal Intelligence System (backend: FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "greenlet>=3.1.0",
    # Cache / realtime state
    "redis>=5.1.0",
    # AI / agents (existing Tavily agent preserved)
    "langchain>=1.4.2",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.6.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.0.0",
    "tavily-python>=0.8.4",
    # Utilities
    "python-dotenv>=1.2.3",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "pylint>=3.3.0",
]

[tool.black]
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.pylint.messages_control]
# Pydantic models are data schemas and legitimately have few/no public methods.
disable = ["too-few-public-methods"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
