[project]
name = "agent-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.2",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.4",
]

[tool.black]
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.pylint.messages_control]
# Pydantic models are data schemas and legitimately have few/no public methods.
disable = ["too-few-public-methods"]
